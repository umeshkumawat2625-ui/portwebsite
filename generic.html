<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Certificates</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding: 20px;
        }

        .certificate-container {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
        }

        .certificate-img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            border: 1px solid #ddd;
        }

        .certificate-title {
            margin-top: 15px;
            font-size: 20px;
            color: #333;
        }
    </style>
</head>
<body>

    <h2>Mera Certificate</h2>

    <div class="certificate-container">
        <!-- 'certificate.jpg' ko apni image file ke path ya name se replace karein -->
        <img src="certificate.jpg" alt="Data Analytics Certificate" class="certificate-img">
        <h3 class="certificate-title">Data Analytics Certification</h3>
    </div>

</body>
</html>
